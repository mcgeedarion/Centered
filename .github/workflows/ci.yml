name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-and-archive:
    name: Test and release archive smoke test
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run release pipeline without local signing credentials
        run: CODE_SIGNING_ALLOWED=NO VALIDATE_PRODUCT=NO ./scripts/release_archive.sh

      - name: Verify release artifacts
        run: |
          test -d build/Centered.xcarchive/Products/Applications/Centered.app
          test -s build/export/Centered.app.zip
