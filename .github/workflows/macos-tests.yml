name: macOS Tests

on:
  pull_request:
  push:
    branches:
      - main
      - work

jobs:
  test:
    name: Build and test Centered
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project Centered.xcodeproj \
            -scheme Centered \
            -destination 'platform=macOS'
